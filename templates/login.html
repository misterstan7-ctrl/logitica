<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Logística</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <form method="POST" class="login-card">
        <div class="login-logo">📦</div>
        <h1>Logística Online</h1>
        <p>Entre para gerenciar suas entregas</p>

        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                {% for categoria, mensagem in mensagens %}
                    <div class="alert {{ categoria }}">{{ mensagem }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <label>Usuário</label>
        <input type="text" name="usuario" placeholder="admin" required>

        <label>Senha</label>
        <input type="password" name="senha" placeholder="1234" required>

        <button type="submit">Entrar</button>

        <small class="login-info">Login inicial: admin / 1234</small>
    </form>
</body>
</html>
